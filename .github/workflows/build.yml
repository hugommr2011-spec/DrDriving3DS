name: Build 3DS Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3DS Portlibs
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev 3ds-citro2d 3ds-citro3d 3ds-libctru

      - name: Build Project
        run: |
          source /etc/profile.d/devkit-env.sh
          make

      - name: Upload .3dsx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrDriving3DS
          path: DrDriving3DS.3dsx
